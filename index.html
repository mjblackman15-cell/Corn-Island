    <script>
      // Ensure window.fetch is writable so browser extension executors can intercept without TypeError
      (function() {
        try {
          var _origFetch = window.fetch;
          var _fetch = typeof _origFetch === 'function' ? _origFetch.bind(window) : _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(newFetch) {
              _fetch = newFetch;
            }
          });
        } catch (e) {}

        // Prevent external extension errors from breaking the page
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
